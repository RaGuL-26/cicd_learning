name : cicd_lelevecho

on:
  workflow_dispatch:

jobs:
  java_code:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          javac javas/hello.java
          java -cp javas hello

  run_py_code:
    runs-on: ubuntu-latest

    steps:
      - name: py_via_cicd
        uses: actions/checkout@v4
        with:
         repository: RaGuL-26/pyhtoncicd
         path : abcd


      - name: Run python
        run: python abcd/python.py




