name: cicdpipeline

on:
  repository_dispatch:
    types: [repo_a_code_updated]

jobs:
  check_py:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: RaGuL-26/pyhtoncicd
          path: company_code

      - name: Run company code
        run: python company_code/hello.py