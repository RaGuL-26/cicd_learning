name : python_app_api

on:
  workflow_dispatch:

jobs:
  job1 :
    name : fastAPI
    runs-on : ubuntu-latest
    steps:
      - uses : actions/checkout@v4
        with :
          repository : RaGuL-26/cicd-project-helping
          path : fastAPI

       
      - run : |
         pip install -r fastAPI/requirements.txt
         python3 fastAPI/app/main.py
         shell : bash

    

